name: Staging End-to-End Tests

on:
  workflow_dispatch:
  schedule:
    - cron: "30 2 * * *"

# The six stable tenant accounts and the resettable E2E data set are shared.
# Queue, rather than overlap, manual, nightly, and pre-release runs.
concurrency:
  group: clubly-staging-e2e
  cancel-in-progress: false

jobs:
  staging-e2e:
    name: Clubly staging role matrix
    runs-on: ubuntu-latest
    timeout-minutes: 90
    environment: staging
    env:
      E2E_STAGING_ENABLED: "true"
      E2E_STAGING_ALLOW_RESET: reset-e2e-staging
      E2E_STAGING_ENABLE_MUTATIONS: "true"
      E2E_STAGING_RUN_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
      E2E_STAGING_BASE_URL: ${{ vars.E2E_STAGING_BASE_URL }}
      E2E_STAGING_API_BASE_URL: ${{ vars.E2E_STAGING_API_BASE_URL }}
      E2E_STAGING_PROJECT_REF: ${{ vars.E2E_STAGING_PROJECT_REF }}
      E2E_STAGING_STORAGE_BUCKETS: ${{ vars.E2E_STAGING_STORAGE_BUCKETS }}
      E2E_STAGING_SUPABASE_URL: ${{ secrets.E2E_STAGING_SUPABASE_URL }}
      E2E_STAGING_SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.E2E_STAGING_SUPABASE_SERVICE_ROLE_KEY }}
      E2E_STAGING_ACTORS_JSON: ${{ secrets.E2E_STAGING_ACTORS_JSON }}
      E2E_STAGING_AUTH_BRIDGE_SECRET: ${{ secrets.E2E_STAGING_AUTH_BRIDGE_SECRET }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - name: Install backend dependencies
        run: npm ci
        working-directory: backend
      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Reset isolated staging E2E data
        run: npm run e2e:staging:reset
        working-directory: backend
      - name: Seed isolated staging E2E data
        run: npm run e2e:staging:seed
        working-directory: backend
      - name: Run staging role suite
        run: npm run test:e2e:staging
        working-directory: frontend
      - name: Upload staging E2E artifacts
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@v4
        with:
          name: staging-e2e-${{ github.run_id }}
          path: |
            frontend/playwright-staging-report/
            frontend/test-results/
          retention-days: 30
